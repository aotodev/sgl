# Native x86-64 build + tests with Clang (the AVX2/FMA path).
name: avx-clang

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'cmake/**'
      - '**/CMakeLists.txt'
      - '.github/workflows/avx-clang.yml'
  pull_request:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/aotodev/sgl-ci:latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure, build and test
        run: |
          CXX=clang++ cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release -DSGL_TESTS=ON
          cmake --build build -j
          ctest --test-dir build --output-on-failure

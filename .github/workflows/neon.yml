# AArch64 cross build + tests (the NEON path). No qemu plumbing here: the toolchain
# file sets CMAKE_CROSSCOMPILING_EMULATOR, which ctest honours.
name: neon

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'cmake/**'
      - '**/CMakeLists.txt'
      - '.github/workflows/neon.yml'
  pull_request:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/aotodev/sgl-ci:latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Configure, build and test
        run: |
          cmake -G Ninja -B build \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-aarch64.cmake \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DSGL_TESTS=ON
          cmake --build build -j
          ctest --test-dir build --output-on-failure

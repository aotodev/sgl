# ASan + UBSan over the test suite. Both compilers: only Clang's UBSan checks pointer-offset overflow.
name: sanitize

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'cmake/**'
      - '**/CMakeLists.txt'
      - '.github/workflows/sanitize.yml'
  pull_request:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  sanitize:
    name: ${{ matrix.cxx }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/aotodev/sgl-ci:latest
      # LeakSanitizer suspends threads through ptrace.
      options: --cap-add=SYS_PTRACE
    strategy:
      fail-fast: false
      matrix:
        cxx: [clang++, g++]
    env:
      UBSAN_OPTIONS: print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - name: Configure, build and test
        run: |
          CXX=${{ matrix.cxx }} cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Debug -DSGL_TESTS=ON -DSGL_SANITIZERS=ON
          cmake --build build -j
          ctest --test-dir build --output-on-failure

# Windows x64 build + tests with MSVC, on the hosted runner: the CI image cannot run MSVC.
name: msvc

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'cmake/**'
      - '**/CMakeLists.txt'
      - '.github/workflows/msvc.yml'
  pull_request:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.build_type }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure, build and test
        run: |
          cmake -G Ninja -B build -DCMAKE_CXX_COMPILER=cl -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DSGL_TESTS=ON
          cmake --build build -j
          ctest --test-dir build --output-on-failure
